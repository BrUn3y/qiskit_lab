name: Publish project website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Version stylesheet and script URLs
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path("site")
          page = root / "index.html"
          html = page.read_text()
          for name in ("styles.css", "app.js"):
              version = sha256((root / name).read_bytes()).hexdigest()[:16]
              original = f'"{name}"'
              assert original in html, f"Missing page reference: {name}"
              html = html.replace(original, f'"{name}?v={version}"')
          page.write_text(html)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
