# yaml-language-server: $schema=https://raw.githubusercontent.com/dam-agents/dam-starter-kits/main/kit.schema.json
schemaVersion: v1
id: qiskit-lab
name: Qiskit Lab
tagline: Develop, simulate and execute quantum experiments on IBM Quantum Platform.
description: >-
  Runs a Qiskit SDK laboratory in DAM with tools for
  Bell, GHZ, Grover, Deutsch–Jozsa, live backend inspection, SamplerV2 QPU
  submission, job results, and locally validated QAOA Max-Cut experiments.
  Includes official Qiskit skills for Runtime migration, error mitigation,
  SQD eigensolver selection, and fermionic simulation.
  IBM Quantum credentials are configured by the owner in a hidden terminal prompt.
category: research
icon: atom
docsUrl: https://github.com/BrUn3y/qiskit_lab
harnesses: [claude-code, codex, pi, bob]
seed:
  self: true
  into: work
install:
  command: bash scripts/dam/install.sh
egressPreset: trusted
egressRules:
  - host: pypi.org
  - host: files.pythonhosted.org
  - host: github.com
  - host: release-assets.githubusercontent.com
  - host: iam.cloud.ibm.com
  - host: resource-controller.cloud.ibm.com
  - host: api.global-search-tagging.cloud.ibm.com
  - host: globalcatalog.cloud.ibm.com
  - host: quantum.cloud.ibm.com
  - host: us-east.quantum.cloud.ibm.com
  - host: eu-de.quantum.cloud.ibm.com
resources:
  storage: 10Gi
  note: Space for the locked Qiskit environment, experiment artifacts and offline HTML reports.
bundledSkills:
  path: .agents/skills
# IBM credentials use the owner's hidden SDK account setup, not chat parameters
# or a custom-header connection. The default briefing follows ONBOARDING.md and
# keeps this schedule held until the agent marks onboarding complete.
schedules:
  - name: Qiskit Lab job reports
    rrule: FREQ=MINUTELY;INTERVAL=2
    timezone: Etc/UTC
    enabled: true
    sessionMode: fresh
    precheck: bash ~/.local/bin/qiskit-lab-dam poll-jobs --precheck
    task: >-
      This is scheduled completion reporting, not first-time onboarding.
      Read ~/AGENTS.md and the Qiskit Lab project instructions it references.
      Run bash ~/.local/bin/qiskit-lab-dam poll-jobs.
      For each pending notification, automatically publish the existing Carbon
      HTML report as a rendered DAM artifact using create_artifact, or
      create_artifact_upload_url and its returned upload instructions for large files.
      Use report_filename and content type text/html. Present the artifact link
      and a supported workspace file link, with job ID, backend and final state.
      Never wait for a visualization request. If publication fails, disclose it,
      preserve the report and leave that notification unacknowledged.
      Only after presenting the link, run bash ~/.local/bin/qiskit-lab-dam poll-jobs
      --ack JOB_ID for that delivered job. Never acknowledge an undelivered report.
      Explain safe error classes and preserve tracking when a query fails.
      Never submit, retry, cancel or modify IBM jobs. Never read credentials.
      Use English. Do not run onboarding, demos or unrelated file scans.
