[project]
name = "qiskit-lab"
version = "0.3.3"
description = "Qiskit SDK tools for DAM and IBM Quantum Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "qiskit>=2.2,<3",
    "qiskit-ibm-runtime>=0.44,<1",
    "qiskit-qasm3-import>=0.6,<1",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "rustworkx>=0.15,<1",
]

[project.scripts]
qiskit-lab = "qiskit_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qiskit_lab"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "jsonschema>=4,<5",
    "pyyaml>=6,<7",
    "ruff>=0.14,<1",
]
typing = ["mypy>=1.19,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[tool.coverage.run]
source = ["qiskit_lab"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "PTH"]
# timezone.utc is supported; an alias-only rewrite adds no safety.
ignore = ["UP017"]

[tool.mypy]
files = ["src/qiskit_lab"]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["qiskit", "qiskit.*", "qiskit_ibm_runtime", "qiskit_ibm_runtime.*"]
# These SDKs do not ship a py.typed marker. Keep other missing imports visible.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qiskit_lab.experiment_engine"
disallow_untyped_defs = true
warn_return_any = true
