[project]
name = "qiskit-lab"
version = "0.3.3"
description = "Qiskit SDK tools for DAM and IBM Quantum Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "qiskit>=2.2,<3",
    "qiskit-ibm-runtime>=0.44,<1",
    "qiskit-qasm3-import>=0.6,<1",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "rustworkx>=0.15,<1",
]

[project.scripts]
qiskit-lab = "qiskit_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qiskit_lab"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "pytest-timeout>=2.4,<3",
    "jsonschema>=4,<5",
    "pyyaml>=6,<7",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[tool.coverage.run]
source = ["qiskit_lab"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
